global
    # global settings here
    log stdout local0
    log stdout local1 notice

defaults
    # defaults here
     balance roundrobin
     log global
     mode http
     option httplog
     timeout connect 60s
     timeout client 60s
     timeout server 60s
     maxconn     10000

frontend web
    # a frontend that accepts requests from clients
    # NB: can't bind directly to reserved ports, e.g port 80
    # but can expose host 80 to container 8081
    bind *:8888
    default_backend web_servers

backend web_servers
    # servers that fulfill the requests
    server server1 nginx:8080
