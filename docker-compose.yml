#prod first
version: '3.4'
services:
  #
  #PROXY
  #
  db:
    image: traefik:v2.2
    healthcheck:
      test: ["CMD-SHELL",
      "wget -q -O- localhost:8082/ping || exit 1"
      ]
      interval: 3s
      timeout: 10s
      retries: 3
    # Enables the web UI and tells Traefik to listen to docker
    command:
      - --log.level=DEBUG
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.watch=true
      #- --providers.docker.network=traefik_proxy_network
      #entry
      - --entryPoints.db.address=:5432

      # healthcheck port
      - --ping.entryPoint=ping
      - --entryPoints.ping.address=:8082

    ports:
      # The Web UI (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: global
      placement:
        constraints:
        - node.labels.db == true
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`traefik.localhost.com`)"
        - "traefik.http.routers.api.service=api@internal"
        - "traefik.http.services.api.loadbalancer.server.port=8080"

  pgbouncer:
    image: bitnami/pgbouncer
    depends_on:
      - pg1
    env_file:
      - .env.db
    environment:
      - POSTGRESQL_HOST=pg1  #required env variable for startup
      - POSTGRESQL_DATABASE=prod
      - PGBOUNCER_DATABASE=prod
      # NB: app connects to database as 'postgres' but what seen is prod (config above)
      # to expose in app as 'prod', set PGBOUNCER_DATABASE

  #PRIMARY DB
  pg1:
    image: 'bitnami/postgresql:latest'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 10s
      retries: 3
    env_file:
      - .env.db
    volumes:
      - pg1data:/bitnami/postgresql
      - /mnt:/mnt   # pgbackrest backup directory (on instance)
      - /tmp:/tmpdb # exposed mount for db/work output
      # pgbackrest initial config
      - /root/releases/abrepo/db/pgbackrest.conf:/etc/pgbackrest.conf

    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - PGBACKREST_REPO1_PATH=/mnt/pgbackrest
      - PGBACKREST_LOG_PATH=/mnt/pgbackrest
      - PGBACKREST_REPO2_S3_BUCKET=abrepo-production-pgbackrest

    deploy:
      replicas: 1
      placement:
        constraints:
        - node.labels.instance == db1
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.to-db.entrypoints=db"
        - "traefik.tcp.routers.to-db.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.to-db.service=primary"
        - "traefik.tcp.services.primary.loadbalancer.server.port=5432"

  web:
    image: '424385760710.dkr.ecr.us-east-2.amazonaws.com/vergeman/abrepo:latest'
    env_file:
      - .env
    command: bash -c "rm -f tmp/pids/server.pid && rake tmp:cache:clear && bundle exec rails s -p 8081 -b '0.0.0.0'"
    healthcheck:
      test: ["CMD-SHELL",
      "curl -o /dev/null -I -f -s -w %{http_code} http://127.0.0.1:8081/healthcheck || exit 1"]
      interval: 5s
      start_period: 15s
      timeout: 5s
      retries: 10

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          #- node.role == worker
          - node.labels.app == true
          #- node.role == manager
      labels:
        - "traefik.enable=false"

  nginx:
    image: '424385760710.dkr.ecr.us-east-2.amazonaws.com/vergeman/abnginx:latest'
    # healthcheck:
    #   test: ["CMD-SHELL",
    #   "curl -o /dev/null -I -f -s -w %{http_code} http://localhost:80/healthcheck || exit 1"]
    #   interval: 3s
    #   timeout: 10s
    #   retries: 3
    ports:
      - "80:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          #- node.role == worker
          - node.labels.app == true
          #- node.role == manager
      labels:
        - "traefik.enable=false"


volumes:
  pg1data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/abrepo_pg1data
    #driver: rexray/dobs
    #driver_opts:
    #  size: 1
  portainer_data:
    driver: local
