#prod first
services:

  pgbouncer:
    image: "bitnamilegacy/pgbouncer:1.23.1"
    depends_on:
      pg1:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGCONNECT_TIMEOUT=3 PGPASSWORD="$${POSTGRESQL_PASSWORD}"
          psql -h 127.0.0.1 -p "$${PGBOUNCER_PORT:-6432}"
          -U "$${POSTGRESQL_USERNAME}" -d "$${PGBOUNCER_DATABASE}"
          -w -tAc 'SELECT 1' > /dev/null
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    env_file:
      - .env.db
    environment:
      - POSTGRESQL_HOST=pg1  #required env variable for startup
      - POSTGRESQL_DATABASE=abrepo_www_prod
      - PGBOUNCER_DATABASE=abrepo_www_prod
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.labels.db == true
        - node.labels.instance == db1

  #PRIMARY DB
  pg1:
    image: 'bitnami/postgresql:13.5.0'
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRESQL_USERNAME:-postgres}" -d "$${POSTGRESQL_DATABASE:-postgres}"']
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 20
    env_file:
      - .env.db
    volumes:
      - pg1data:/bitnami/postgresql
      - /mnt:/mnt   # pgbackrest backup directory (on instance)
      - /tmp:/tmpdb # exposed mount for scratch db/work output
      - "${REMOTE_RELEASE_PATH:-.}/db/pgbackrest.conf:/etc/pgbackrest.conf"
      - "${REMOTE_RELEASE_PATH:-.}/db/postgresql_custom.conf:/opt/bitnami/postgresql/conf/conf.d/postgresql_custom.conf"

    environment:
      - PGBACKREST_REPO1_PATH=/mnt/pgbackrest
      - PGBACKREST_LOG_PATH=/mnt/pgbackrest
      - PGBACKREST_REPO2_S3_BUCKET=abrepo-production-web-pg-pgbackrest
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.labels.db == true
        - node.labels.instance == db1

  web:
    depends_on:
      pgbouncer:
        condition: service_healthy
    build: ./app
    image: "${WEB_IMAGE:-abrepo/abrepo}:${GIT_COMMIT:-latest}"
    env_file:
      - .env
    command: bash -c "rm -f tmp/pids/server.pid && rake tmp:cache:clear && bundle exec rails s -p 8081 -b '0.0.0.0'"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://127.0.0.1:8081/healthcheck"]
      interval: 5s
      start_period: 30s
      timeout: 5s
      retries: 24

    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      placement:
        constraints:
          #- node.role == worker
          - node.labels.app == true
          #- node.role == manager

  nginx:
    depends_on:
      web:
        condition: service_healthy
    image: "${NGINX_IMAGE:-abrepo/abnginx}:${GIT_COMMIT:-latest}"
    build:
      context: ./nginx
      additional_contexts:
        rails_assets: service:web
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://127.0.0.1:8080/healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    environment:
      - NGINX_PORT=8080

    volumes:
      # image internally uses envsubst to generate /etc/nginx/default.conf
      # allows usage of env variables
      - "${REMOTE_RELEASE_PATH:-.}/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template"
      - "${REMOTE_RELEASE_PATH:-.}/certbot/:/etc/letsencrypt/live/abrepo.com/"
    deploy:
      mode: global
      update_config:
        parallelism: 1
        # start-first runs new container side-by-side then replaces it
        # allows single replica (host mode) for nginx
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        window: 15s
      placement:
        constraints:
          #- node.role == worker
          - node.labels.app == true
          #- node.labels.db != true  #app or lb
          #- node.role == manager

  haproxy:
    depends_on:
      nginx:
        condition: service_healthy
    image: "haproxy:lts"
    volumes:
      - "${REMOTE_RELEASE_PATH:-.}/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg"
      - "${REMOTE_RELEASE_PATH:-.}/certbot/:/etc/letsencrypt/live/abrepo.com/"
    ports:
      - 8404:8404  # leave possibly open to access haproxy <host:8404>/stats
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          #- node.role == worker
          #- node.labels.lb == true
          - node.labels.db != true  #app or lb
          #- node.role == manager

volumes:
  pg1data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/abrepo_pg1data
    #driver: rexray/dobs
    #driver_opts:
    #  size: 1
  portainer_data:
    driver: local
