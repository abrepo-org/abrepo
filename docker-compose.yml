#prod first
version: '3.4'
services:
  #
  #PROXY
  #
  db:
    # The official v2 Traefik docker image
    image: traefik:v2.2
    # Enables the web UI and tells Traefik to listen to docker
    command:
      - --log.level=DEBUG
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.watch=true
      #- --providers.docker.network=traefik_proxy_network
      #entry
      - --entryPoints.db.address=:5432

    ports:
      # The Web UI (enabled by --api.insecure=true)
      - "8080:8080"

    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`traefik.localhost.com`)"
        - "traefik.http.routers.api.service=api@internal"
        - "traefik.http.services.api.loadbalancer.server.port=8080"

#
# Failover:
# 0. promote replica to primary via shell: pg_ctl promote -D <pg db path>
# 1. change POSTGRESQL_REPLICATION_MODE=master/slave on each service
# 2. toggle traefik.enable = true/false (traefik enabled true only on master)
# 3. rename volume in cloud, or set new volume here
#
  #PRIMARY DB
  pg1:
    image: 'bitnami/postgresql:latest'
    env_file:
      - .env.db
    volumes:
      - pg1data:/bitnami/postgresql
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
    deploy:
      placement:
        constraints:
        - node.hostname == db-1
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.to-db.entrypoints=db"
        - "traefik.tcp.routers.to-db.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.to-db.service=primary"
        - "traefik.tcp.services.primary.loadbalancer.server.port=5432"


  #REPLICA DB - traefik disabled
  pg2:
    image: 'bitnami/postgresql:latest'
    env_file:
      - .env.db
    volumes:
      - pg2data:/bitnami/postgresql
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
    deploy:
      placement:
        constraints:
        - node.hostname == db-2
      labels:
        - "traefik.enable=false"
        - "traefik.tcp.routers.to-db.entrypoints=db"
        - "traefik.tcp.routers.to-db.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.to-db.service=primary"
        - "traefik.tcp.services.primary.loadbalancer.server.port=5432"


  web:
    build: ./app
    image: '424385760710.dkr.ecr.us-east-2.amazonaws.com/vergeman/abrepo:latest'
    env_file:
      - .env
    command: bash -c "rm -f tmp/pids/server.pid && rake tmp:cache:clear && bundle exec rails s -p 8081 -b '0.0.0.0'"
    ports:
      - "8081:8081"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker
          - node.labels.type == app
          #- node.role == manager
      labels:
        - "traefik.enable=false"
    depends_on:
      - db

volumes:
  pg1data:
    driver: rexray/dobs
    driver_opts:
      size: 1
  pg2data:
    driver: rexray/dobs
    driver_opts:
      size: 1
