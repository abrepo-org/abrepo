#dev settings - stubs for now
version: '3.4'
services:
  web:
    healthcheck:
      test: ""
    volumes:
      # NB: this will require gem install, webpacker build, db perms
      # for dev environment (since it overrides)
      - ./app:/app
    environment:
      - RAILS_ENV=development
      - APPLICATION_HOST=http://localhost
      - FILE_HOST=
    labels:
      - "traefik.enable=false"

  db:
    command:
      - --log.level=DEBUG
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.watch=true
      - --entryPoints.db.address=:5432

      # healthcheck port
      - --ping.entryPoint=ping
      - --entryPoints.ping.address=:8082

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost.com`)"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  pg1:
    #chown -R 1001:1001 /db
    volumes:
      - ./db/postgres:/bitnami/postgresql
    #NB: Service level labels
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.to-db.entrypoints=db"
      - "traefik.tcp.routers.to-db.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.to-db.service=primary"
      - "traefik.tcp.services.primary.loadbalancer.server.port=5432"

  nginx:
    volumes:
      - ./app/public:/app/public
      - /home/vergeman/dev/ab/screenshots:/app/public/screenshots
      - ./app/app/assets:/app/app/assets
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    #needed for build
    depends_on:
      - web

volumes:
  pg1data:
    driver: local
  pg2data:
    driver: local
  portainer_data:
    driver: local
