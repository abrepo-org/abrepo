#dev settings - stubs for now
version: '3.4'
services:

  pgbouncer:
    environment:
      - POSTGRESQL_DATABASE=dev
      - PGBOUNCER_DATABASE=dev

  pg1:
    #chown -R 1001:1001 /db
    volumes:
      - ./db/postgres:/bitnami/postgresql
      - ./db/pgbackrest.conf:/etc/pgbackrest.conf
      - ./db/archive.conf:/opt/bitnami/postgresql/conf/conf.d/archive.conf
    environment:
      - PGBACKREST_REPO1_PATH=/tmpdb/pgbackrest
      - PGBACKREST_LOG_PATH=/tmpdb/pgbackrest
      - PGBACKREST_REPO2_S3_BUCKET=abrepo-dev-pgbackrest

  web:
    build: ./app
    healthcheck:
      test: ""
    volumes:
      # NB: this will require gem install, webpacker build, db perms
      # for dev environment (since it overrides)
      - ./app:/app
    environment:
      - RAILS_ENV=development
      - APPLICATION_HOST=http://localhost
      - FILE_HOST=

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    volumes:
      - ./app/public:/app/public
      - /home/vergeman/dev/ab/screenshots:/app/public/screenshots
      - ./app/app/assets:/app/app/assets
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    #needed for build
    depends_on:
      - web

volumes:
  pg1data:
    driver: local
  portainer_data:
    driver: local
